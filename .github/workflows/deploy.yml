name: Deploy

# Only pushes to main deploy. Feature branches get CI (ci.yml) but not a deploy.
on:
  push:
    branches: [main]

# Never let two deploys overlap; let an in-flight one finish first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; github.repository can contain caps.
      - id: meta
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-backend:latest
            ${{ steps.meta.outputs.prefix }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-frontend:latest
            ${{ steps.meta.outputs.prefix }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the VPS copy of the compose file + Caddyfile in sync with the repo,
      # so edits here take effect on the next deploy. The secret `.env` on the
      # box is never touched.
      - name: Copy runtime files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: "~/portfolio"

      - name: SSH in and roll the new images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/portfolio
            export IMAGE_PREFIX="${{ needs.build-and-push.outputs.prefix }}"
            export IMAGE_TAG="${{ github.sha }}"
            docker compose pull
            docker compose up -d
            docker image prune -f
