# Production runtime for the VPS.
#
# Images are built and pushed to GHCR by the GitHub Actions "Deploy" workflow.
# This file, the Caddyfile, and a `.env` (see .env.prod.example) live together
# on the VPS. Deploy = `docker compose pull && docker compose up -d`.
#
# IMAGE_PREFIX / IMAGE_TAG come from the `.env` file (auto-read by compose) or
# from the shell (the deploy job exports IMAGE_TAG=<commit sha>).

services:
  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/satriaapn/my-portofolio}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      # Overrides the image default; kept explicit so the volume path is obvious.
      DB_PATH: /data/portfolio.db
    volumes:
      - backend-data:/data
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/satriaapn/my-portofolio}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side data fetches (lib/api.ts) hit the backend over the compose
      # network. Browser calls to /api/* are routed by Caddy, not by this.
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]

  # One-shot SQLite -> Google Drive backup. NOT started by `docker compose up`
  # (held out of the default run by its profile). Trigger it on demand or from
  # a host cron entry:
  #   0 0 * * *  cd ~/portfolio && docker compose --profile backup run --rm backup
  # First-time setup (authorize gdrive once; the token persists in the volume):
  #   docker compose --profile backup run --rm --entrypoint rclone backup config
  backup:
    image: ${IMAGE_PREFIX:-ghcr.io/satriaapn/my-portofolio}-backup:${IMAGE_TAG:-latest}
    profiles: ["backup"]
    env_file: .env
    environment:
      DB_PATH: /data/portfolio.db
      RCLONE_CONFIG: /config/rclone/rclone.conf
      # rclone remote name (created during first-time `rclone config`).
      RCLONE_REMOTE: gdrive
      # Destination folder on Drive, and how many days of copies to keep.
      GDRIVE_DIR: portfolio-backups
      RETENTION_DAYS: "30"
      # Only affects the timestamp in backup filenames; change to taste.
      TZ: UTC
    volumes:
      # The live SQLite volume, shared with the backend. `.backup` reads it
      # consistently even while the backend is writing.
      - backend-data:/data
      # Persists the gdrive OAuth token across runs/redeploys.
      - rclone-config:/config/rclone
    networks: [web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    networks: [web]

networks:
  web:

volumes:
  backend-data:
  caddy-data:
  caddy-config:
  rclone-config:
